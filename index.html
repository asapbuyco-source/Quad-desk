<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Quant Desk</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* ── Design Tokens ────────────────────────────────────────── */
      :root {
        --font-sans: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        /* Zinc dark palette */
        --slate-50:  #fafafa;  --slate-100: #f4f4f5;
        --slate-200: #e4e4e7;  --slate-300: #d4d4d8;
        --slate-400: #a1a1aa;  --slate-500: #71717a;
        --slate-600: #52525b;  --slate-700: #3f3f46;
        --slate-800: #27272a;  --slate-850: #202023;
        --slate-900: #18181b;  --slate-950: #09090b;
        /* Brand */
        --brand-dark:    #000000;
        --brand-surface: #121212;
        --brand-accent:  #3b82f6; /* Electric Blue */
        /* Trade */
        --trade-bid:  #10b981; /* Emerald */
        --trade-ask:  #f43f5e; /* Rose    */
        --trade-warn: #f59e0b; /* Amber   */
      }

      body {
        font-family: var(--font-sans);
        /* Deep Neutral Dark Background */
        background: radial-gradient(circle at 60% 0%, #18181b 0%, #000000 100%);
        color: #e4e4e7;
        overflow: hidden;
      }
      
      /* Darker Glass Card for True Dark Theme */
      .fintech-card {
        background: rgba(18, 18, 18, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        border-radius: 16px;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }
      
      .text-glow {
        text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
      }
    </style>

  }
}

</html>

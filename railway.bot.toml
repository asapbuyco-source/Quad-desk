# Railway configuration for the Quad-desk Trading Bot service.
#
# In your Railway dashboard (Bot Service) → Settings → Config File Path
# set this to: railway.bot.toml

[build]
builder      = "nixpacks"
watchPatterns = ["bot/**"]

[phases.install]
cmds = ["python3 -m pip install -r bot/requirements.txt"]

[deploy]
startCommand      = "python3 -m bot.main"
restartPolicyType = "ON_FAILURE"
numReplicas       = 1

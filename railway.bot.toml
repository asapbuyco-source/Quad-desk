# Railway configuration for the Quad-desk Trading Bot service.
#
# In your Railway dashboard (Bot Service) → Settings → Config File Path
# set this to: railway.bot.toml
#
# IMPORTANT: In your Railway dashboard, "Root Directory" MUST be left blank
# or set to `/` (the main folder). Do NOT set it to `/bot`.

[build]
builder      = "nixpacks"
watchPatterns = ["bot/**"]

[deploy]
# Create a virtualenv in /tmp (always writable even on Nix) so pip can
# install freely without hitting the externally-managed-environment wall.
startCommand      = "python3 -m venv /tmp/botenv && /tmp/botenv/bin/pip install --quiet -r bot/requirements.txt && /tmp/botenv/bin/python -m bot.main"
restartPolicyType = "ON_FAILURE"
numReplicas       = 1

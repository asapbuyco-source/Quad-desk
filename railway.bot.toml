# Railway configuration for the Quad-desk Trading Bot service.
#
# In your Railway dashboard (Bot Service) → Settings → Config File Path
# set this to: railway.bot.toml
#
# IMPORTANT: In your Railway dashboard, "Root Directory" MUST be left blank 
# or set to `/` (the main folder). Do NOT set it to `/bot`.

[build]
builder      = "nixpacks"
watchPatterns = ["bot/**"]

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.build]
cmds = [
    "python -m venv /app/venv && . /app/venv/bin/activate && pip install -U pip && pip install -r bot/requirements.txt"
]

[deploy]
startCommand      = ". /app/venv/bin/activate && python -m bot.main"
restartPolicyType = "ON_FAILURE"
numReplicas       = 1

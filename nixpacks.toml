# nixpacks.toml — Bot service ONLY (frontend is on Netlify, backend on Render)
#
# - python312: Nix Python runtime
# - libstdc++6: Ubuntu apt package that provides libstdc++.so.6, required by
#   numpy/pandas manylinux pip wheels (Nix garbage-collects gcc-lib after build,
#   so we pin it via apt to ensure it survives into the runtime container)

[phases.setup]
nixPkgs = ["python312"]
aptPkgs = ["libstdc++6"]

[phases.install]
cmds = [
    "python3 -m venv /app/.venv",
    "/app/.venv/bin/pip install --no-cache-dir -r bot/requirements.txt"
]

[phases.build]
cmds = []

[phases.setup]
# Add Python 3 explicitly so it is available in the runtime environment.
# nixpacks auto-detects Node.js but uses the bare 'python' alias which
# does not exist on Ubuntu; 'python3' is the correct binary.
nixPkgs = ["...", "python312", "python312Packages.pip"]

[start]
cmd = "python3 -m pip install --no-cache-dir -r bot/requirements.txt && python3 -m bot.main"

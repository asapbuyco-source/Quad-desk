# Railway configuration for the Quad-desk Trading Bot service.
#
# In your Railway dashboard (Bot Service) → Settings → Config File Path
# set this to: bot/railway.toml
#
# Required environment variables (add in Railway → Variables tab):
#   GEMINI_API_KEY
#   BINANCE_API_KEY
#   BINANCE_API_SECRET
#   FIREBASE_ADMIN_CREDENTIALS  (full JSON string of Firebase service account)
#   BOT_TESTNET                 (true / false)
#   BOT_SYMBOL                  (default: BTCUSDT)
#   BOT_MAX_RISK_PCT            (default: 2.0)
#   BOT_MIN_CONFIDENCE          (default: 0.70)
#   BOT_ANALYSIS_INTERVAL       (default: 10)

[build]
builder      = "nixpacks"
watchPatterns = ["bot/**"]

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["pip install -r bot/requirements.txt"]

[deploy]
startCommand      = "python -m bot.main"
restartPolicyType = "ON_FAILURE"
numReplicas       = 1
# No healthcheckPath — the bot is not a web server
